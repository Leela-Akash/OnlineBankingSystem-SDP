spring.application.name=ONLINEBANKING-SPRINGBOOT-TEST

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_LOCK_TIMEOUT=30000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=30000

# Fast isolated in-memory testing
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT Test Configuration
jwt.secret=c2VjdXJlQmFua2luZ1N5c3RlbVNlY3JldEtleUZvckpXVFRva2VuR2VuZXJhdGlvbjEyMzQ1Ng==
jwt.expiration=900000
jwt.refresh-expiration=604800000

# CORS
allowed.origins=http://localhost:5173,http://localhost:3000
